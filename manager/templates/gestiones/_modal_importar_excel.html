<div class="modal fade" id="{{ modal_id }}" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content excel-import-modal">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bx bx-upload"></i> Importar {{ titulo }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <form class="excel-import-form" data-import-url="{{ import_url }}">
        {% csrf_token %}
        <div class="modal-body">
          {% if descripcion %}
          <p>{{ descripcion }}</p>
          {% else %}
          <p>Selecciona la plantilla completada en formato Excel.</p>
          {% endif %}
          <input type="file" name="archivo" class="form-control" accept=".xlsx" required>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          <button type="submit" class="btn classbotones"><i class="bx bx-upload"></i> Importar</button>
        </div>
      </form>
    </div>
  </div>
</div>
